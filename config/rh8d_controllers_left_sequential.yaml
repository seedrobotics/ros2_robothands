# Controllers for the left RH8D with finger_coupling:=sequential
# (virtual motor joints as the command interface).
controller_manager:
  ros__parameters:
    update_rate: 100

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    hand_controller:
      type: joint_trajectory_controller/JointTrajectoryController

hand_controller:
  ros__parameters:
    joints:
      - l_wrist_rotation_joint
      - l_wrist_adduction_joint
      - l_wrist_flexion_joint
      - l_thumb_abduction_joint
      - l_thumb_flexion_joint
      - l_index_flexion_joint
      - l_middle_flexion_joint
      - l_ring_little_flexion_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
