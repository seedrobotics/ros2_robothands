# Controllers for the right RH8D with finger_coupling:=sequential
# (virtual motor joints as the command interface).
controller_manager:
  ros__parameters:
    update_rate: 100

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    hand_controller:
      type: joint_trajectory_controller/JointTrajectoryController

hand_controller:
  ros__parameters:
    joints:
      - r_wrist_rotation_joint
      - r_wrist_adduction_joint
      - r_wrist_flexion_joint
      - r_thumb_abduction_joint
      - r_thumb_flexion_joint
      - r_index_flexion_joint
      - r_middle_flexion_joint
      - r_ring_little_flexion_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
