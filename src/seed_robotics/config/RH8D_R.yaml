# ROS 2 parameter file for the RH8D Right Hand controller.
# The top-level key must match the node name declared in hand_handle_node.py.
hand_handle_node:
  ros__parameters:
    baudrate: 1000000
    port: "/dev/ttyUSB0"
    frequency: 20
    light_mode: false
    prefix: "R_"
    joint_mapping:
      r_main_board: 30
      r_w_rotation: 31
      r_w_adduction: 32
      r_w_flexion: 33
      r_th_adduction: 34
      r_th_flexion: 35
      r_ix_flexion: 36
      r_middle_flexion: 37
      r_ring_ltl_flexion: 38
    # Normalized mode: publish R_Joints_normalized and accept R_speed_position_normalized.
    # Off by default; usually enabled via the launch arg (normalized_mode:=true).
    normalized_mode: false
    # Per-joint raw-step calibration, used only when normalized_mode is true.
    #   pos_min / pos_max : raw steps at the two ends of the normalized range
    #     wrist  ('_w_') -> [-0.7854, 0.7854] rad
    #     finger         -> [0.0 (open), 1.0 (closed)]
    #   speed_max : raw speed treated as full scale (|normalized speed| = 1.0)
    # TODO: replace these PLACEHOLDER numbers with real calibration values.
    joint_limits:
      r_w_rotation:       {pos_min: 1024, pos_max: 3072, speed_max: 1023}
      r_w_adduction:      {pos_min: 1024, pos_max: 3072, speed_max: 1023}
      r_w_flexion:        {pos_min: 1024, pos_max: 3072, speed_max: 1023}
      r_th_adduction:     {pos_min: 0,    pos_max: 4095, speed_max: 1023}
      r_th_flexion:       {pos_min: 0,    pos_max: 4095, speed_max: 1023}
      r_ix_flexion:       {pos_min: 0,    pos_max: 4095, speed_max: 1023}
      r_middle_flexion:   {pos_min: 0,    pos_max: 4095, speed_max: 1023}
      r_ring_ltl_flexion: {pos_min: 0,    pos_max: 4095, speed_max: 1023}
