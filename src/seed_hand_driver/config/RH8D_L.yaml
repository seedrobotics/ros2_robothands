# ROS 2 parameter file for the RH8D Right Hand controller.
# The top-level key must match the node name declared in hand_handle_node.py.
hand_handle_node:
  ros__parameters:
    baudrate: 1000000
    port: "/dev/ttyUSB0"
    frequency: 50
    light_mode: false
    prefix: "L_"
    joint_mapping: 
      l_main_board: 40
      l_wrist_rotation_joint: 41
      l_wrist_adduction_joint: 42
      l_wrist_flexion_joint: 43
      l_thumb_abduction_joint: 44
      l_thumb_flexion_joint: 45
      l_index_flexion_joint: 46
      l_middle_flexion_joint: 47
      l_ring_little_flexion_joint: 48

