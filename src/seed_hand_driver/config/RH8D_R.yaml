# ROS 2 parameter file for the RH8D Right Hand controller.
# The top-level key must match the node name declared in hand_handle_node.py.
hand_handle_node:
  ros__parameters:
    baudrate: 1000000
    port: "/dev/ttyUSB0"
    frequency: 20
    light_mode: false
    prefix: "R_"
    joint_mapping:
      r_main_board: 30
      r_wrist_rotation_joint: 31
      r_wrist_adduction_joint: 32
      r_wrist_flexion_joint: 33
      r_thumb_abduction_joint: 34
      r_thumb_flexion_joint: 35
      r_index_flexion_joint: 36
      r_middle_flexion_joint: 37
      r_ring_little_flexion_joint: 38
