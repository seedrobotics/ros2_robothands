# ROS 2 parameter file for two RH8D hands (Right + Left) on the same bus.
hand_handle_node:
  ros__parameters:
    baudrate: 1000000
    port: "/dev/ttyUSB0"
    frequency: 20
    light_mode: false
    prefix: "RL_"
    joint_mapping:
      r_main_board: 30
      r_wrist_rotation_joint: 31
      r_wrist_adduction_joint: 32
      r_wrist_flexion_joint: 33
      r_thumb_abduction_joint: 34
      r_thumb_flexion_joint: 35
      r_index_flexion_joint: 36
      r_middle_flexion_joint: 37
      r_ring_little_flexion_joint: 38
      l_main_board: 40
      l_wrist_rotation_joint: 41
      l_wrist_adduction_joint: 42
      l_wrist_flexion_joint: 43
      l_thumb_abduction_joint: 44
      l_thumb_flexion_joint: 45
      l_index_flexion_joint: 46
      l_middle_flexion_joint: 47
      l_ring_little_flexion_joint: 48
