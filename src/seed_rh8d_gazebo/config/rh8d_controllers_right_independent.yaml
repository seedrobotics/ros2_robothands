# Controllers for the right RH8D with finger_coupling:=independent
# (all 19 joints actuated; drive them via scripts/rh8d_coupling_node.py for
# tendon-like sequential/adaptive behavior, or directly for research).
controller_manager:
  ros__parameters:
    update_rate: 100

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    hand_controller:
      type: joint_trajectory_controller/JointTrajectoryController

hand_controller:
  ros__parameters:
    joints:
      - r_wrist_rotation_joint
      - r_wrist_adduction_joint
      - r_wrist_flexion_joint
      - r_thumb_abduction_joint
      - r_thumb_proximal_joint
      - r_thumb_medial_joint
      - r_thumb_distal_joint
      - r_index_proximal_joint
      - r_index_medial_joint
      - r_index_distal_joint
      - r_middle_proximal_joint
      - r_middle_medial_joint
      - r_middle_distal_joint
      - r_ring_proximal_joint
      - r_ring_medial_joint
      - r_ring_distal_joint
      - r_little_proximal_joint
      - r_little_medial_joint
      - r_little_distal_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
